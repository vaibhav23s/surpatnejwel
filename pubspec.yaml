name: surpatne_jewellers
description: "Surpatne Jewellers - Trust. Purity. Elegance."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  http: ^1.2.2
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  url_launcher: ^6.3.1
  confetti: ^0.8.0
  fl_chart: ^1.2.0
  razorpay_flutter: ^1.4.0
  image_picker: ^1.1.2
  firebase_storage: ^13.6.0
  pdf: ^3.11.1
  printing: ^5.13.4
  shared_preferences: ^2.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  intl: ^0.20.2

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
    - assets/icon/
    - assets/images/
    - assets/collection/
    - assets/pandent_collection/
    - assets/onboarding/

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/icon/logo.png"

  min_sdk_android: 21

  remove_alpha_ios: true

  # Android adaptive icon
  adaptive_icon_background: "#0A0A0A"
  adaptive_icon_foreground: "assets/icon/logo.png"

  # iOS
  background_color_ios: "#0A0A0A"